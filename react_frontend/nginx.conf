server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # GZIP 压缩以减少跨国传输的数据量
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
      application/javascript
      application/json
      text/css
      text/plain;

    location / {
        try_files $uri $uri/ /index.html;
        
        # 添加缓存控制
        add_header Cache-Control "public, max-age=3600";
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
    }

    # 如果需要，可以在 nginx 层代理 API 请求以避免浏览器的 CORS 限制
